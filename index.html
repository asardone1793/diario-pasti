<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario pasti</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario pasti">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F6F7A">
<meta name="app-version" content="2026-09-15.3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F3; --surface:#FFFFFF; --ink:#1B2B2E; --muted:#667578; --line:#DFE6DA;
  --teal:#1F6F7A; --green:#7FAA2E; --amber:#C98A12; --plum:#8A5A9E; --skip:#B4574A;
  --ok-bg:#EAF3DA; --swap-bg:#DDEEF0; --other-bg:#F8EDD5; --free-bg:#EFE4F4; --skip-bg:#F4E1DE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A1B; --surface:#1B2527; --ink:#E7EEEC; --muted:#93A3A5; --line:#2C3A3C;
    --teal:#5DB3BF; --green:#A6CF5A; --amber:#E7B04A; --plum:#C295D6; --skip:#E08A7D;
    --ok-bg:#27351A; --swap-bg:#1A3336; --other-bg:#3A2F17; --free-bg:#33273A; --skip-bg:#3A2320;
  }
}
:root[data-theme="dark"]{
  --bg:#121A1B; --surface:#1B2527; --ink:#E7EEEC; --muted:#93A3A5; --line:#2C3A3C;
  --teal:#5DB3BF; --green:#A6CF5A; --amber:#E7B04A; --plum:#C295D6; --skip:#E08A7D;
  --ok-bg:#27351A; --swap-bg:#1A3336; --other-bg:#3A2F17; --free-bg:#33273A; --skip-bg:#3A2320;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Figtree,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;
  padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daterow h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:-.01em;text-transform:capitalize}
.daterow .sub{color:var(--muted);font-size:.9rem}
.navbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:50%;
  font-size:1.2rem;display:grid;place-items:center;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.chip{border:0;background:transparent;color:var(--ink);padding:6px 0 8px;border-radius:12px;cursor:pointer;font:inherit}
.chip .d{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.chip .n{font-weight:700;font-size:1.05rem}
.chip .dots{display:flex;justify-content:center;gap:2px;margin-top:4px;height:5px}
.chip .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.chip.on{background:var(--teal);color:#fff}
.chip.on .d{color:#ffffffcc}
.chip.today .n{text-decoration:underline;text-underline-offset:3px}
main{padding-top:14px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.meal.st-ok{border-left:6px solid var(--green)} .meal.st-swap{border-left:6px solid var(--teal)}
.meal.st-other{border-left:6px solid var(--amber)} .meal.st-free{border-left:6px solid var(--plum)}
.meal.st-skip{border-left:6px solid var(--skip)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 2px}
.mname{font-weight:700;font-size:1.02rem}
.badge{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px}
.b-ok{background:var(--ok-bg);color:var(--green)} .b-swap{background:var(--swap-bg);color:var(--teal)}
.b-other{background:var(--other-bg);color:var(--amber)} .b-free{background:var(--free-bg);color:var(--plum)}
.b-skip{background:var(--skip-bg);color:var(--skip)}
.planned{padding:2px 14px 10px;color:var(--muted);font-size:.93rem}
.planned.strike{text-decoration:line-through;opacity:.6}
.swapnote{padding:0 14px 8px;font-size:.8rem;color:var(--teal);font-weight:600}
.act:disabled{opacity:.35;cursor:not-allowed}
.actual{margin:0 14px 10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:.93rem}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 10px 12px}
.act{min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:10px 2px;font:inherit;font-size:.76rem;font-weight:600;cursor:pointer}
.act[aria-pressed="true"].a-ok{background:var(--green);border-color:var(--green);color:#fff}
.act[aria-pressed="true"].a-swap{background:var(--teal);border-color:var(--teal);color:#fff}
.act[aria-pressed="true"].a-other{background:var(--amber);border-color:var(--amber);color:#fff}
.act[aria-pressed="true"].a-free{background:var(--plum);border-color:var(--plum);color:#fff}
.act[aria-pressed="true"].a-skip{background:var(--skip);border-color:var(--skip);color:#fff}
.editor{padding:0 14px 14px;display:grid;gap:8px}
select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:10px;padding:10px}
textarea{min-height:64px;resize:vertical}
.notes{margin-top:6px}
.notes label{font-weight:700;display:block;margin-bottom:6px}
.status{color:var(--muted);font-size:.8rem;text-align:center;margin:12px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:10px;border-radius:10px;cursor:pointer}
nav.tabs button.on{color:var(--teal);background:var(--swap-bg)}
.grid{display:grid;grid-template-columns:78px repeat(7,1fr);gap:4px;font-size:.78rem}
.grid .h{font-weight:700;text-align:center;color:var(--muted);padding:4px 0;text-transform:capitalize}
.grid .rl{font-weight:600;display:flex;align-items:center}
.cell{aspect-ratio:1;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;
  font-weight:800;font-size:.8rem;cursor:pointer;padding:0;color:var(--ink)}
.c-ok{background:var(--green);border-color:var(--green);color:#fff}
.c-swap{background:var(--teal);border-color:var(--teal);color:#fff}
.c-other{background:var(--amber);border-color:var(--amber);color:#fff}
.c-free{background:var(--plum);border-color:var(--plum);color:#fff}
.c-skip{background:var(--skip);border-color:var(--skip);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;font-size:.85rem}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.list h3{font-size:1rem;margin:18px 0 6px}
.list p{margin:2px 0;font-size:.9rem}
.list .m{color:var(--muted)}
.backup{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.backup h3{margin:0 0 4px;font-size:1rem}
.backup p{margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.brow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.brow button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 4px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.swaprow{display:flex;gap:6px;padding:0 10px 12px}
.swaprow button{flex:1;border:1px dashed var(--teal);background:transparent;color:var(--teal);border-radius:10px;padding:9px 6px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.swaprow button:disabled{opacity:.4;cursor:not-allowed}
.hint{padding:0 14px 10px;font-size:.78rem;color:var(--muted)}
.cell.swapped{box-shadow:inset 0 0 0 2px var(--teal)}
.update{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;background:var(--teal);color:#fff;
  border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px #0003}
.update span{flex:1;font-size:.9rem;font-weight:600}
.update button{border:0;background:#fff;color:#1F6F7A;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
.ver{text-align:center;font-size:.72rem;color:var(--muted);margin:-4px 0 8px}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="daterow">
    <button class="navbtn" id="prev" aria-label="Giorno precedente">‹</button>
    <div style="text-align:center">
      <h1 id="title">—</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="navbtn" id="next" aria-label="Giorno successivo">›</button>
  </div>
  <div class="strip" id="strip"></div>
</div></header>

<main class="wrap">
  <section id="dayView"></section>
  <section id="weekView" hidden></section>
  <div class="status" id="status">Caricamento…</div>
</main>

<nav class="tabs">
  <button id="tabDay" class="on">Giorno</button>
  <button id="tabWeek">Settimana</button>
</nav>

<script>
const DAYS=["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
const MEALS=[["colazione","Colazione"],["sp_matt","Spuntino mattina"],["pranzo","Pranzo"],["sp_pom","Spuntino pomeriggio"],["cena","Cena"]];
const PLAN=[
 {colazione:"Uova (2), pane integrale 80g",sp_matt:"Frutta secca 10g, 1 frutto",pranzo:"Pasta integrale 80g, pesce spada 150g, pomodori, melanzane",sp_pom:"Yogurt greco 0% 150g, 1 frutto",cena:"Petto di pollo 200g, insalata verde e pomodorini"},
 {colazione:"Affettato magro 70g, pane integrale 70g",sp_matt:"1 frutto",pranzo:"Farro 50g, legumi 60g, verdure",sp_pom:"Yogurt greco 0% 150g, frutta 150g",cena:"Vitello alla piastra 200g, verdure al vapore"},
 {colazione:"Uova (2), pane integrale 80g",sp_matt:"1 frutto",pranzo:"Pasta integrale 80g al pomodorino, mozzarella 150g, zucchine",sp_pom:"Yogurt greco 0% 150g, frutta 150g",cena:"Pesce bianco al forno 200g, verdure"},
 {colazione:"Pane integrale 70g, affettato magro 70g",sp_matt:"10 mandorle",pranzo:"Riso basmati 80g, salmone affumicato 120g, verdure cotte",sp_pom:"Yogurt greco 0% 150g, frutta 150g",cena:"Orata al forno 200g, insalata mista"},
 {colazione:"Uova (2), pane integrale 70g",sp_matt:"1 frutto (150g)",pranzo:"Gnocchi 200g al pomodoro + parmigiano, macinato di manzo 150g",sp_pom:"Yogurt greco 0% 150g, 1 frutto",cena:"Tagliata di pollo 200g, verdure cotte"},
 {colazione:"Yogurt greco 0% 150g, cereali 40g",sp_matt:"1 mela, noci 10g",pranzo:"Cous cous 70g, tonno naturale 120g, zucchine e pomodorini",sp_pom:"Yogurt greco 0% 150g, frutta 150g",cena:"Pizza"},
 {colazione:"Yogurt greco 0% 150g, 1 frutto",sp_matt:"Frutta secca 10g",pranzo:"Pasta 70g al pomodoro + cacioricotta, pesce 200g, insalata verde",sp_pom:"1 frutto",cena:"Insalata con straccetti di pollo 150g, pomodori, caroselli, carote, rucola"}
];
const SWAP_GROUP={colazione:["colazione"],sp_matt:["sp_matt","sp_pom"],sp_pom:["sp_matt","sp_pom"],pranzo:["pranzo","cena"],cena:["pranzo","cena"]};
const STATES=[["ok","Fatto"],["other","Altro"],["free","Libero"],["skip","Saltato"]];
const LABEL=Object.fromEntries(STATES);
const LETTER={ok:"✓",other:"A",free:"L",skip:"✕"};
const COLOR={ok:"green",other:"amber",free:"plum",skip:"skip"};
const MEAL_NAME=Object.fromEntries(MEALS);
const LS_KEY="diario_pasti_v1";

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dayIdx=d=>(d.getDay()+6)%7;
const fromIso=s=>{const [y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>addDays(d,-dayIdx(d));
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o||{slots:{},note:""}));

let cur=new Date(); cur.setHours(0,0,0,0);
let view="day", openMeal=null, openSwap=null;
let logs={};   // iso -> {slots:{meal:{s,txt}}, assign:{meal:"iso|meal"}, note}
function getLog(k){return logs[k]||{slots:{},note:""}}

/* ---------- plan and swaps ----------
   A "slot" is "iso|meal". Each slot is assigned one meal of the plan (by default its own).
   A swap exchanges the assigned meals of two slots in the same week, so every planned meal
   appears exactly once per week however many swaps are made. */
const slotKey=(k,m)=>k+"|"+m;
const splitSlot=v=>{const i=v.lastIndexOf("|");return [v.slice(0,i),v.slice(i+1)]};
const slotName=v=>{const [k,m]=splitSlot(v);return MEAL_NAME[m]+" di "+DAYS[dayIdx(fromIso(k))]};
const planText=v=>{const [k,m]=splitSlot(v);return PLAN[dayIdx(fromIso(k))][m]};
function assigned(v){const [k,m]=splitSlot(v);return (logs[k]&&logs[k].assign&&logs[k].assign[m])||v}
function setAssign(v,val){
  const [k,m]=splitSlot(v),L=clone(getLog(k));
  L.assign=L.assign||{};
  if(val===v) delete L.assign[m]; else L.assign[m]=val;
  if(!Object.keys(L.assign).length) delete L.assign;
  logs[k]=L;
}
function exchange(a,b){const va=assigned(a),vb=assigned(b);setAssign(a,vb);setAssign(b,va)}
function weekSlots(d,meals){
  const mon=monday(d),out=[];
  for(let i=0;i<7;i++){const k=iso(addDays(mon,i));for(const m of meals) out.push(slotKey(k,m))}
  return out;
}
const isEaten=v=>{const [k,m]=splitSlot(v);return getLog(k).slots[m]?.s==="ok"};
function holderOf(origin,d){ // slot in the week currently holding meal `origin`
  const [,m]=splitSlot(origin);
  return weekSlots(d,SWAP_GROUP[m]).find(v=>assigned(v)===origin);
}

/* ---------- saving (this device only) ---------- */
function status(t){$("status").textContent=t}
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(logs));status("Salvato su questo iPhone")}
  catch(e){status("Salvataggio non riuscito: esporta un backup.")}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveLocal()});
window.addEventListener("pagehide",saveLocal);

// Convert data from the previous version (status "swap" with from="dayIndex|meal")
function migrate(){
  let changed=false;
  for(const k of Object.keys(logs).sort()){
    const L=logs[k]; if(!L||!L.slots) continue;
    for(const m of Object.keys(L.slots)){
      const sl=L.slots[m];
      if(sl&&sl.s==="swap"){
        if(sl.from&&/^\d\|/.test(sl.from)){
          const [di,fm]=sl.from.split("|");
          const src=slotKey(iso(addDays(monday(fromIso(k)),+di)),fm), me=slotKey(k,m);
          if(assigned(me)===me&&assigned(src)===src) exchange(me,src);
        }
        logs[k].slots[m]={s:"ok"}; changed=true;
      }
    }
  }
  if(changed) saveLocal();
}

/* ---------- backup ---------- */
function stamp(){const d=new Date();return iso(d)+"_"+pad(d.getHours())+pad(d.getMinutes())}
async function deliver(filename,text,type){
  const blob=new Blob([text],{type});
  const file=new File([blob],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==="AbortError")return}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function exportJSON(){
  deliver("diario_pasti_"+stamp()+".json",JSON.stringify({app:"diario_pasti",version:2,exported:new Date().toISOString(),logs},null,1),"application/json");
}
function csvCell(v){v=String(v??"");return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  const rows=[["data","giorno","pasto","previsto","scambiato_con","stato","dettaglio","nota_giorno"]];
  for(const k of Object.keys(logs).sort()){
    const di=dayIdx(fromIso(k)),L=logs[k];
    for(const [m,name] of MEALS){
      const v=slotKey(k,m),a=assigned(v),sl=L.slots&&L.slots[m];
      if(!sl&&a===v) continue;
      rows.push([k,DAYS[di],name,planText(a),a===v?"":slotName(a),sl?LABEL[sl.s]:"",sl&&sl.txt||""]);
    }
    if(L.note) rows.push([k,DAYS[di],"","","","","",L.note]);
  }
  deliver("diario_pasti_"+stamp()+".csv","\ufeff"+rows.map(r=>r.map(csvCell).join(";")).join("\n"),"text/csv");
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{data=JSON.parse(r.result)}catch(e){alert("File non valido: non è un JSON.");return}
    const inc=data&&data.logs;
    if(!inc||typeof inc!=="object"){alert("File non valido: manca l'elenco dei giorni.");return}
    const keys=Object.keys(inc).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k));
    const overlap=keys.filter(k=>logs[k]).length;
    if(!confirm("Importare "+keys.length+" giorni?"+(overlap?" "+overlap+" giorni già presenti verranno sostituiti.":""))) return;
    for(const k of keys){const v=inc[k]||{};logs[k]={slots:v.slots||{},note:v.note||"",...(v.assign?{assign:v.assign}:{})}}
    migrate();saveLocal();render();alert("Importati "+keys.length+" giorni.");
  };
  r.readAsText(file);
}

/* ---------- actions ---------- */
function setSlot(k,meal,patch){
  const L=clone(getLog(k)), next={...(L.slots[meal]||{}),...patch};
  if(!next.s) delete L.slots[meal]; else L.slots[meal]=next;
  logs[k]=L; saveLocal(); render();
}

/* ---------- rendering ---------- */
function renderStrip(){
  const mon=monday(cur), today=iso(new Date());
  $("strip").innerHTML=DAYS.map((d,i)=>{
    const dt=addDays(mon,i),k=iso(dt),L=getLog(k);
    const dots=MEALS.map(([m])=>{const s=L.slots[m]?.s;return `<i style="${s?`background:var(--${COLOR[s]})`:""}"></i>`}).join("");
    return `<button class="chip ${k===iso(cur)?"on":""} ${k===today?"today":""}" data-k="${k}">
      <div class="d">${d.slice(0,3)}</div><div class="n">${dt.getDate()}</div><div class="dots">${dots}</div></button>`;
  }).join("");
  $("strip").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cur=fromIso(b.dataset.k);openMeal=openSwap=null;render()});
}

function renderDay(){
  const k=iso(cur),di=dayIdx(cur),L=getLog(k);
  $("title").textContent=DAYS[di];
  $("subtitle").textContent=cur.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"});
  let html="";
  for(const [m,name] of MEALS){
    const v=slotKey(k,m), a=assigned(v), swapped=a!==v;
    const slot=L.slots[m], s=slot?.s;
    const targets=weekSlots(cur,SWAP_GROUP[m]).filter(x=>x!==v);
    const canSwap=s!=="ok"&&targets.some(x=>!isEaten(x));
    let undoOk=false;
    if(swapped){const h=holderOf(v,cur);undoOk=s!=="ok"&&h&&!isEaten(h);}
    html+=`<article class="meal ${s?"st-"+s:swapped?"st-swap":""}">
      <div class="mhead"><span class="mname">${name}</span>${s?`<span class="badge b-${s}">${LABEL[s]}</span>`:""}</div>
      ${swapped?`<div class="swapnote">⇄ In origine: ${esc(slotName(a).toLowerCase())}</div>`:""}
      <div class="planned ${s&&s!=="ok"?"strike":""}">${esc(planText(a))}</div>
      ${s&&s!=="ok"&&slot.txt?`<div class="actual">${esc(slot.txt)}</div>`:""}
      <div class="actions">${STATES.map(([id,lab])=>`<button class="act a-${id}" aria-pressed="${s===id}" data-m="${m}" data-s="${id}">${lab}</button>`).join("")}</div>
      ${openMeal===m&&s&&s!=="ok"?textEditor(m,slot):""}
      <div class="swaprow">
        <button data-swap="${m}" ${canSwap?"":"disabled"}>${openSwap===m?"Chiudi":"Scambia"}</button>
        ${swapped?`<button data-undo="${m}" ${undoOk?"":"disabled"}>Annulla scambio</button>`:""}
      </div>
      ${s==="ok"?`<div class="hint">Già mangiato: per scambiarlo togli prima "Fatto".</div>`:""}
      ${openSwap===m&&canSwap?swapEditor(v,targets):""}
    </article>`;
  }
  html+=`<div class="notes"><label for="note">Note del giorno</label>
    <textarea id="note" placeholder="Fame, energia, allenamento, acqua…">${esc(L.note||"")}</textarea></div>`;
  $("dayView").innerHTML=html;

  $("dayView").querySelectorAll(".act").forEach(b=>b.onclick=()=>{
    const m=b.dataset.m,s=b.dataset.s,curS=getLog(k).slots[m]?.s;
    openSwap=null;
    if(curS===s){
      if(s==="ok"||openMeal===m){openMeal=null;setSlot(k,m,{s:null,txt:null});}
      else{openMeal=m;render();}
      return;
    }
    openMeal=(s==="ok")?null:m;
    setSlot(k,m,{s,txt:s==="ok"?null:(getLog(k).slots[m]?.txt||"")});
  });
  $("dayView").querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>{openSwap=openSwap===b.dataset.swap?null:b.dataset.swap;openMeal=null;render()});
  $("dayView").querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{
    const v=slotKey(k,b.dataset.undo),h=holderOf(v,cur);
    if(h){exchange(v,h);saveLocal();openSwap=null;render();}
  });
  const sel=$("dayView").querySelector("select[data-swapfrom]");
  if(sel) $("dayView").querySelector("[data-confirm]").onclick=()=>{
    if(!sel.value) return;
    exchange(sel.dataset.swapfrom,sel.value);saveLocal();openSwap=null;render();
  };
  const ta=$("dayView").querySelector("textarea[data-m]");
  if(ta) ta.oninput=()=>{const L2=clone(getLog(k));L2.slots[ta.dataset.m]={...L2.slots[ta.dataset.m],txt:ta.value};logs[k]=L2;saveLocal();};
  $("note").oninput=e=>{const L2=clone(getLog(k));L2.note=e.target.value;logs[k]=L2;saveLocal();};
}
function swapEditor(v,targets){
  const opts=targets.map(x=>{
    const dis=isEaten(x);
    return `<option value="${x}" ${dis?"disabled":""}>${esc(slotName(x))}: ${esc(planText(assigned(x)))}${dis?" (già mangiato)":""}</option>`;
  }).join("");
  return `<div class="editor"><select data-swapfrom="${v}" aria-label="Scambia con"><option value="">Scambia con…</option>${opts}</select>
    <div class="swaprow" style="padding:0"><button data-confirm>Conferma scambio</button></div></div>`;
}
function textEditor(m,slot){
  const ph={other:"Cosa hai mangiato?",free:"Cosa hai mangiato? (facoltativo)",skip:"Motivo (facoltativo)"}[slot.s];
  return `<div class="editor"><textarea data-m="${m}" placeholder="${ph}">${esc(slot.txt||"")}</textarea></div>`;
}

function renderWeek(){
  const mon=monday(cur),sun=addDays(mon,6);
  $("title").textContent="Settimana";
  $("subtitle").textContent=mon.toLocaleDateString("it-IT",{day:"numeric",month:"short"})+" – "+sun.toLocaleDateString("it-IT",{day:"numeric",month:"short"});
  let g=`<div class="grid"><div></div>${DAYS.map(d=>`<div class="h">${d.slice(0,3)}</div>`).join("")}`;
  const counts={ok:0,other:0,free:0,skip:0}; let nSwap=0;
  for(const [m,name] of MEALS){
    g+=`<div class="rl">${name.replace("Spuntino ","Sp. ")}</div>`;
    for(let i=0;i<7;i++){
      const k=iso(addDays(mon,i)),v=slotKey(k,m),s=getLog(k).slots[m]?.s,sw=assigned(v)!==v;
      if(s) counts[s]++; if(sw) nSwap++;
      g+=`<button class="cell ${s?"c-"+s:""} ${sw?"swapped":""}" data-k="${k}" aria-label="${name} ${DAYS[i]}: ${s?LABEL[s]:"non segnato"}${sw?", scambiato":""}">${s?LETTER[s]:sw?"⇄":""}</button>`;
    }
  }
  g+=`</div>`;
  const legend=`<div class="legend">${STATES.map(([id,l])=>`<span><i style="background:var(--${COLOR[id]})"></i>${l} ${counts[id]}</span>`).join("")}<span><i style="box-shadow:inset 0 0 0 2px var(--teal)"></i>Pasti spostati ${nSwap}</span></div>`;
  let list="";
  for(let i=0;i<7;i++){
    const k=iso(addDays(mon,i)),L=getLog(k);
    const rows=MEALS.map(([m,n])=>{
      const v=slotKey(k,m),a=assigned(v),sl=L.slots[m],parts=[];
      if(a!==v) parts.push(`⇄ ${esc(slotName(a).toLowerCase())}`);
      if(sl&&sl.s!=="ok") parts.push(`<span class="m">(${LABEL[sl.s]})</span> ${esc(sl.txt||"")}`);
      return parts.length?`<p><b>${n}</b> ${parts.join(" · ")}</p>`:"";
    }).join("");
    if(rows||L.note) list+=`<h3 style="text-transform:capitalize">${DAYS[i]} ${addDays(mon,i).getDate()}</h3>${rows}${L.note?`<p class="m">Nota: ${esc(L.note)}</p>`:""}`;
  }
  const backup=`<div class="backup"><h3>Backup</h3>
    <p>I dati sono salvati solo su questo iPhone. Esporta un backup ogni tanto; il CSV si apre con Numbers o Excel.</p>
    <div class="brow"><button id="bJson">Esporta JSON</button><button id="bCsv">Esporta CSV</button><button id="bImp">Importa JSON</button></div>
    <input type="file" id="fImp" accept="application/json,.json" hidden></div>`;
  $("weekView").innerHTML=g+legend+(list?`<div class="list">${list}</div>`:"")+backup;
  $("bJson").onclick=exportJSON; $("bCsv").onclick=exportCSV;
  $("bImp").onclick=()=>$("fImp").click();
  $("fImp").onchange=e=>{const f=e.target.files[0];if(f)importJSON(f);e.target.value=""};
  $("weekView").querySelectorAll(".cell").forEach(c=>c.onclick=()=>{cur=fromIso(c.dataset.k);setView("day")});
}

function render(){
  renderStrip();
  if(view==="day"){
    const a=document.activeElement, id=a&&a.id, isTa=a&&a.matches&&a.matches("textarea[data-m]"), pos=a&&a.selectionStart;
    renderDay();
    const t=id==="note"?$("note"):isTa?$("dayView").querySelector("textarea[data-m]"):null;
    if(t){t.focus();try{t.setSelectionRange(pos,pos)}catch(e){}}
  } else renderWeek();
}
function setView(v){
  view=v;$("dayView").hidden=v!=="day";$("weekView").hidden=v!=="week";
  $("tabDay").classList.toggle("on",v==="day");$("tabWeek").classList.toggle("on",v==="week");
  render();window.scrollTo(0,0);
}
$("tabDay").onclick=()=>setView("day");
$("tabWeek").onclick=()=>setView("week");
$("prev").onclick=()=>{cur=addDays(cur,view==="day"?-1:-7);openMeal=openSwap=null;render()};
$("next").onclick=()=>{cur=addDays(cur,view==="day"?1:7);openMeal=openSwap=null;render()};

/* ---------- updates ---------- */
const APP_VERSION=document.querySelector('meta[name="app-version"]').content;
let updateShown=false;
async function checkUpdate(){
  if(updateShown||location.protocol==="file:") return;
  try{
    const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const m=(await r.text()).match(/name="app-version" content="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION){
      updateShown=true;
      const bar=document.createElement("div");bar.className="update";
      bar.innerHTML='<span>Nuova versione disponibile. I tuoi dati restano salvati.</span><button>Aggiorna</button>';
      bar.querySelector("button").onclick=()=>{saveLocal();location.replace(location.pathname+"?v="+encodeURIComponent(m[1]))};
      document.body.appendChild(bar);
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});

/* ---------- startup ---------- */
try{logs=JSON.parse(localStorage.getItem(LS_KEY)||"{}")||{}}catch(e){logs={}}
migrate();
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
render();
checkUpdate();
$("status").insertAdjacentHTML("afterend",`<div class="ver">Versione ${APP_VERSION}</div>`);
status(Object.keys(logs).length?"Salvato su questo iPhone":"Nessun dato ancora: inizia a segnare i pasti.");
</script>
